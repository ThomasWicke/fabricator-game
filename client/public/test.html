<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fabricator — multi-client test harness</title>
    <style>
      body {
        margin: 0;
        background: #0c1016;
        color: #e8edf4;
        font-family: system-ui, sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 8px 14px;
        font-size: 13px;
      }
      header .code {
        font-weight: 800;
        letter-spacing: 0.15em;
      }
      .grid {
        display: grid;
        grid-template-columns: 2fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 6px;
        padding: 0 6px 6px;
        height: calc(100vh - 40px);
        box-sizing: border-box;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 1px solid #2a3546;
        border-radius: 8px;
        background: #000;
      }
      #screen-frame {
        grid-row: 1 / 3;
      }
    </style>
  </head>
  <body>
    <header>
      <span>test harness</span>
      <span class="code" id="code-label"></span>
      <span style="color:#8b98a9">screen + two controllers, one browser profile (via ?pid= throwaway identities)</span>
    </header>
    <div class="grid">
      <iframe id="screen-frame" title="screen"></iframe>
      <iframe id="c1-frame" title="controller 1"></iframe>
      <iframe id="c2-frame" title="controller 2"></iframe>
    </div>
    <script>
      const ALPHABET = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
      let code = new URLSearchParams(location.search).get("code");
      if (!code) {
        code = "";
        for (let i = 0; i < 4; i++) {
          code += ALPHABET[Math.floor(Math.random() * ALPHABET.length)];
        }
      }
      code = code.toLowerCase();
      document.getElementById("code-label").textContent = code.toUpperCase();
      document.getElementById("screen-frame").src = `/screen/${code}`;
      // Stagger controller joins so slot assignment is deterministic (t1 → P1).
      setTimeout(() => {
        document.getElementById("c1-frame").src = `/c/${code}?pid=t1&nick=Tab%201`;
      }, 400);
      setTimeout(() => {
        document.getElementById("c2-frame").src = `/c/${code}?pid=t2&nick=Tab%202`;
      }, 900);
    </script>
  </body>
</html>

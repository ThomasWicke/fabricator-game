<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0c1016" />
    <title>Fabricator</title>
    <style>
      :root {
        --bg: #0c1016;
        --panel: #151b24;
        --panel-2: #1c2430;
        --text: #e8edf4;
        --muted: #8b98a9;
        --p1: #35d0ba;
        --p2: #ff9f43;
        --accent: #6c9ef8;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
        overscroll-behavior: none;
      }
      #app {
        height: 100%;
      }

      /* ── landing ─────────────────────────────────────────────── */
      .landing {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px;
        text-align: center;
      }
      .landing h1 {
        font-size: 28px;
        letter-spacing: 0.14em;
        margin: 0;
      }
      .landing .sub {
        color: var(--muted);
        margin: 0 0 12px;
        font-size: 14px;
      }
      .landing button,
      .join-form button {
        font: inherit;
        font-weight: 700;
        padding: 14px 28px;
        border-radius: 14px;
        border: 0;
        background: var(--accent);
        color: #0b1220;
        cursor: pointer;
      }
      .landing .divider {
        color: var(--muted);
        font-size: 13px;
      }
      .join-form {
        display: flex;
        gap: 10px;
      }
      .join-form input {
        font: inherit;
        font-weight: 700;
        letter-spacing: 0.2em;
        width: 110px;
        text-align: center;
        text-transform: uppercase;
        padding: 12px;
        border-radius: 14px;
        border: 1px solid #2a3546;
        background: var(--panel);
        color: var(--text);
        outline: none;
      }

      /* ── screen ──────────────────────────────────────────────── */
      .screen {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .screen-stage {
        position: relative;
        flex: 1;
        min-height: 0;
        background: #000;
      }
      .screen-stage canvas {
        display: block;
      }
      .split-divider {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 3px;
        transform: translateX(-50%);
        background: #0c1016;
        pointer-events: none;
        z-index: 5;
      }
      .screen-hud {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 8px 14px;
        background: var(--panel);
        font-size: 13px;
      }
      .screen-hud .code {
        font-weight: 800;
        letter-spacing: 0.18em;
      }
      .screen-hud .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px;
        border-radius: 99px;
        background: var(--panel-2);
        color: var(--muted);
      }
      .screen-hud .chip .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #45526a;
      }
      .screen-hud .chip.on {
        color: var(--text);
      }
      .screen-hud .chip.p1.on .dot {
        background: var(--p1);
      }
      .screen-hud .chip.p2.on .dot {
        background: var(--p2);
      }
      .screen-hud .spacer {
        flex: 1;
      }
      .screen-hud .hint {
        color: var(--muted);
      }
      .qr-overlay {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: rgba(8, 11, 16, 0.86);
        backdrop-filter: blur(4px);
        text-align: center;
      }
      .qr-overlay.hidden {
        display: none;
      }
      .qr-overlay .label {
        color: var(--muted);
        font-size: 14px;
      }
      .qr-overlay .code {
        font-size: 40px;
        font-weight: 800;
        letter-spacing: 0.24em;
      }
      .qr-overlay canvas {
        border-radius: 12px;
        background: #fff;
        padding: 8px;
      }
      .qr-overlay .url {
        color: var(--muted);
        font-size: 12px;
        word-break: break-all;
        max-width: 80%;
      }
      .qr-overlay .dismiss {
        margin-top: 8px;
        font: inherit;
        font-size: 13px;
        padding: 8px 18px;
        border-radius: 10px;
        border: 1px solid #2a3546;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }

      /* ── controller ──────────────────────────────────────────── */
      .controller {
        position: fixed;
        inset: 0;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
      }
      .controller .status {
        position: absolute;
        top: env(safe-area-inset-top, 8px);
        left: 0;
        right: 0;
        text-align: center;
        font-size: 12px;
        color: var(--muted);
        padding: 8px;
        pointer-events: none;
        z-index: 3;
      }
      .controller .status .slot-name {
        font-weight: 800;
      }
      .controller.slot-1 {
        background: radial-gradient(120% 100% at 50% 100%, #10312c 0%, var(--bg) 60%);
      }
      .controller.slot-2 {
        background: radial-gradient(120% 100% at 50% 100%, #3a2712 0%, var(--bg) 60%);
      }
      .btn-zone {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 45%;
        z-index: 2;
      }
      .stick-zone {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 55%;
        z-index: 1;
      }
      .action-btn {
        position: absolute;
        width: 88px;
        height: 88px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        font: inherit;
        font-size: 26px;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
      }
      .action-btn.pressed {
        background: rgba(255, 255, 255, 0.28);
        border-color: rgba(255, 255, 255, 0.5);
      }
      #btn-a {
        left: 20%;
        bottom: 22%;
      }
      #btn-b {
        left: 44%;
        bottom: 42%;
      }
      .stick-base {
        position: absolute;
        width: 132px;
        height: 132px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.04);
        transform: translate(-50%, -50%);
        pointer-events: none;
        opacity: 0;
      }
      .stick-nub {
        position: absolute;
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.32);
        transform: translate(-50%, -50%);
        pointer-events: none;
        opacity: 0;
      }
      .controller .zone-hint {
        position: absolute;
        bottom: 12%;
        width: 100%;
        text-align: center;
        color: rgba(255, 255, 255, 0.22);
        font-size: 13px;
        pointer-events: none;
      }
      .blueprint-btn {
        position: absolute;
        top: calc(env(safe-area-inset-top, 8px) + 34px);
        left: 12px;
        z-index: 4;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid #2a3546;
        background: rgba(21, 27, 36, 0.9);
        color: var(--text);
      }

      /* ── sketch overlay (the Fabricator blueprint pad) ────────── */
      .sketch-overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: calc(env(safe-area-inset-top, 8px) + 10px) 14px 14px;
        background: #0c1016;
        touch-action: none;
      }
      .sketch-overlay.hidden {
        display: none;
      }
      .sketch-overlay input {
        font: inherit;
        font-weight: 600;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #2a3546;
        background: var(--panel);
        color: var(--text);
        outline: none;
      }
      .sketch-card {
        flex: 1;
        min-height: 0;
        background: #f4f1e8;
        border-radius: 14px;
        overflow: hidden;
        position: relative;
      }
      .sketch-card canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      .sketch-actions {
        display: flex;
        gap: 8px;
      }
      .sketch-actions button {
        font: inherit;
        font-weight: 700;
        padding: 12px 0;
        border-radius: 12px;
        border: 1px solid #2a3546;
        background: var(--panel);
        color: var(--text);
        flex: 1;
      }
      .sketch-actions button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #0b1220;
        flex: 2;
      }
      .fabricating-note {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(env(safe-area-inset-bottom, 8px) + 8px);
        text-align: center;
        color: #8fc1ff;
        font-size: 13px;
        font-weight: 700;
        pointer-events: none;
        z-index: 5;
      }
      .fabricating-note.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

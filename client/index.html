<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0c1016" />
    <title>Fabricator</title>
    <style>
      :root {
        --bg: #0c1016;
        --panel: #151b24;
        --panel-2: #1c2430;
        --line: #232d3c;
        --text: #e8edf4;
        --muted: #8b98a9;
        --p1: #f06eaa;
        --p2: #ff9f43;
        --accent: #6c9ef8;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
        overscroll-behavior: none;
      }
      #app {
        height: 100%;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      .spacer {
        flex: 1;
      }
      .hint {
        color: var(--muted);
      }

      /* ── landing ─────────────────────────────────────────────── */
      .landing {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 28px 20px;
        text-align: center;
      }
      .landing h1 {
        font-size: 28px;
        letter-spacing: 0.14em;
        margin: 0;
      }
      .landing .sub {
        color: var(--muted);
        margin: 0 0 10px;
        font-size: 14px;
      }
      .landing .foot-note {
        color: var(--muted);
        font-size: 12px;
        max-width: 420px;
        line-height: 1.6;
        margin: 6px 0 0;
      }
      .cards {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        justify-content: center;
        width: 100%;
        max-width: 700px;
      }
      .card {
        flex: 1 1 300px;
        max-width: 340px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        text-align: left;
      }
      .card h2 {
        margin: 0;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .card p {
        margin: 0;
        font-size: 13px;
        line-height: 1.55;
        color: var(--muted);
        flex: 1;
      }
      .card b {
        color: var(--text);
      }
      .landing button,
      .join-form button {
        font-weight: 700;
        padding: 14px 20px;
        border-radius: 14px;
        border: 0;
        background: var(--accent);
        color: #0b1220;
      }
      .landing button:disabled {
        background: var(--panel-2);
        color: #56637a;
        cursor: not-allowed;
      }
      .join-form {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .join-row {
        display: flex;
        gap: 10px;
      }
      .join-form input {
        font: inherit;
        font-weight: 600;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--text);
        outline: none;
        min-width: 0;
      }
      .join-form input:focus {
        border-color: var(--accent);
      }
      .join-form #join-code {
        font-weight: 800;
        letter-spacing: 0.24em;
        width: 120px;
        text-align: center;
        text-transform: uppercase;
      }
      .join-form button {
        flex: 1;
      }

      /* ── screen lobby ────────────────────────────────────────── */
      .lobby {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .lobby-head,
      .lobby-foot {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 20px;
        font-size: 13px;
      }
      .lobby-head {
        border-bottom: 1px solid var(--line);
      }
      .lobby-foot {
        border-top: 1px solid var(--line);
      }
      .lobby-head .brand {
        font-weight: 800;
        letter-spacing: 0.16em;
      }
      .lobby-body {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-content: start;
        gap: 16px;
        padding: 16px 20px;
        overflow: auto;
      }
      .lobby-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-width: 0;
      }
      .panel-title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .panel-title .step {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--panel-2);
        color: var(--text);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0;
      }
      .join-block {
        display: flex;
        gap: 16px;
        align-items: center;
      }
      .join-block canvas {
        background: #fff;
        padding: 7px;
        border-radius: 12px;
        flex: none;
      }
      .join-copy {
        min-width: 0;
      }
      .join-copy .label {
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .join-copy .big-code {
        font-size: 46px;
        line-height: 1.1;
        font-weight: 800;
        letter-spacing: 0.18em;
      }
      .join-copy .url {
        font-size: 12px;
        color: var(--accent);
        word-break: break-all;
        margin: 2px 0 8px;
      }
      .slots {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .slot-card {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border-radius: 14px;
        background: var(--panel-2);
        border: 1px solid transparent;
      }
      .slot-card .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #3a465c;
        flex: none;
      }
      .slot-card.p1.ready,
      .slot-card.p1.joined {
        border-color: rgba(240, 110, 170, 0.45);
      }
      .slot-card.p2.ready,
      .slot-card.p2.joined {
        border-color: rgba(255, 159, 67, 0.45);
      }
      .slot-card.p1.ready .dot,
      .slot-card.p1.joined .dot {
        background: var(--p1);
      }
      .slot-card.p2.ready .dot,
      .slot-card.p2.joined .dot {
        background: var(--p2);
      }
      .slot-card.ready .dot {
        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.08);
      }
      .slot-card.empty .slot-name,
      .slot-card.offline .slot-name {
        color: var(--muted);
      }
      .slot-name {
        font-weight: 700;
        font-size: 16px;
      }
      .slot-state {
        font-size: 12px;
        color: var(--muted);
      }
      .spectators {
        font-size: 12px;
        color: var(--muted);
      }
      .lobby-note {
        font-size: 13px;
        line-height: 1.55;
        color: var(--muted);
      }
      .lobby-note b {
        color: var(--text);
      }
      .lobby-foot button.primary {
        font-weight: 800;
        letter-spacing: 0.08em;
        padding: 14px 30px;
        border-radius: 14px;
        border: 0;
        background: var(--accent);
        color: #0b1220;
      }
      .lobby-foot button.pulse {
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(108, 158, 248, 0.5);
        }
        50% {
          box-shadow: 0 0 0 10px rgba(108, 158, 248, 0);
        }
      }
      @media (max-width: 900px) {
        .lobby-body {
          grid-template-columns: 1fr;
        }
        .join-copy .big-code {
          font-size: 36px;
        }
      }

      /* ── controller lobby ────────────────────────────────────── */
      .pad-lobby {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: calc(env(safe-area-inset-top, 10px) + 10px) 16px
          calc(env(safe-area-inset-bottom, 10px) + 14px);
        background: var(--bg);
      }
      .pad-lobby.slot-1 {
        background: radial-gradient(120% 90% at 50% 0%, #371527 0%, var(--bg) 55%);
      }
      .pad-lobby.slot-2 {
        background: radial-gradient(120% 90% at 50% 0%, #3a2712 0%, var(--bg) 55%);
      }
      .pad-lobby-head {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
      }
      .pad-lobby-head .room {
        font-weight: 800;
        letter-spacing: 0.16em;
        color: var(--text);
      }
      .you-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .you-slot {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.18em;
      }
      .you-slot.p1 {
        color: var(--p1);
      }
      .you-slot.p2 {
        color: var(--p2);
      }
      .you-slot.spectator {
        color: var(--muted);
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .field span {
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .field input {
        font: inherit;
        font-size: 22px;
        font-weight: 700;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--text);
        outline: none;
      }
      .field input:focus {
        border-color: var(--accent);
      }
      .lobby-roster {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .roster-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-radius: 14px;
        background: var(--panel);
        border: 1px solid var(--line);
        font-size: 14px;
      }
      .roster-row .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: none;
      }
      .roster-row.p1 .dot {
        background: var(--p1);
      }
      .roster-row.p2 .dot {
        background: var(--p2);
      }
      .roster-row.offline .dot {
        background: #3a465c;
      }
      .roster-row .rname {
        font-weight: 700;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .roster-row .rstate {
        font-size: 12px;
        color: var(--muted);
      }
      .roster-empty {
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px dashed var(--line);
        color: var(--muted);
        font-size: 13px;
      }
      .lobby-actions {
        margin-top: auto;
        display: flex;
        gap: 10px;
      }
      .lobby-actions .ghost {
        padding: 16px 18px;
        border-radius: 16px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }
      .ready-btn {
        flex: 1;
        padding: 18px;
        border-radius: 16px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0.08em;
      }
      .ready-btn.on {
        background: var(--accent);
        border-color: var(--accent);
        color: #0b1220;
      }
      .ready-btn:disabled {
        opacity: 0.45;
      }
      .pad-lobby .lobby-foot {
        border: 0;
        padding: 0;
        justify-content: center;
        text-align: center;
        font-size: 12px;
        color: var(--muted);
        min-height: 16px;
      }

      /* ── screen ──────────────────────────────────────────────── */
      .screen {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .screen-stage {
        position: relative;
        flex: 1;
        min-height: 0;
        background: #000;
      }
      .screen-stage canvas {
        display: block;
      }
      .split-divider {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 3px;
        transform: translateX(-50%);
        background: #0c1016;
        pointer-events: none;
        z-index: 5;
      }
      /* ── in-frame HUD ────────────────────────────────────────── */
      .hud {
        position: absolute;
        inset: 0;
        z-index: 8;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 0.85em 1em;
        /* scales with the display so it stays readable across a room */
        font-size: clamp(14px, 1.7vh, 22px);
      }
      .hud-top,
      .hud-bottom {
        display: flex;
        align-items: flex-start;
        gap: 0.8em;
      }
      .hud-bottom {
        align-items: flex-end;
      }
      .glass {
        background: rgba(10, 14, 20, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 12px;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      }

      /* player cards sit over their own half of the split screen */
      .player-card {
        display: flex;
        align-items: center;
        gap: 0.65em;
        padding: 0.5em 0.85em;
        min-width: 9.5em;
        transition: opacity 0.2s;
      }
      .player-card.p2 {
        flex-direction: row-reverse;
        text-align: right;
      }
      .player-card .dot {
        width: 0.8em;
        height: 0.8em;
        border-radius: 50%;
        background: #45526a;
        flex: none;
        box-shadow: 0 0 0 0.22em rgba(255, 255, 255, 0.06);
      }
      .player-card.p1.on .dot {
        background: var(--p1);
        box-shadow: 0 0 0 3px rgba(240, 110, 170, 0.22);
      }
      .player-card.p2.on .dot {
        background: var(--p2);
        box-shadow: 0 0 0 3px rgba(255, 159, 67, 0.22);
      }
      .player-card .who {
        display: flex;
        flex-direction: column;
        line-height: 1.25;
        min-width: 0;
      }
      .player-card .name {
        font-weight: 800;
        letter-spacing: 0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .player-card .tool {
        font-size: 0.8em;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .player-card .tool.has {
        color: #9fd4ff;
      }
      .player-card:not(.on) {
        opacity: 0.55;
      }

      /* shared team stockpile, centred between the two halves */
      .resources {
        display: flex;
        align-items: center;
        gap: 0.15em;
        padding: 0.35em 0.4em;
        margin: 0 auto;
      }
      .res {
        display: flex;
        align-items: center;
        gap: 0.5em;
        padding: 0.2em 0.8em;
        border-radius: 0.6em;
      }
      .res + .res {
        border-left: 1px solid rgba(255, 255, 255, 0.08);
      }
      .res svg {
        display: block;
        flex: none;
        width: 1.2em;
        height: 1.2em;
      }
      .res .n {
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        min-width: 2ch;
      }
      .res.zero {
        opacity: 0.45;
      }
      @keyframes resBump {
        0% {
          transform: scale(1);
          color: var(--text);
        }
        35% {
          transform: scale(1.32);
          color: #c9e77f;
        }
        100% {
          transform: scale(1);
          color: var(--text);
        }
      }
      .res.bump .n {
        animation: resBump 0.45s ease-out;
      }
      @keyframes resSpend {
        0% {
          transform: scale(1);
        }
        35% {
          transform: scale(0.78);
          color: #ff9f9f;
        }
        100% {
          transform: scale(1);
        }
      }
      .res.spend .n {
        animation: resSpend 0.45s ease-out;
      }

      /* bottom row: room code, transient messages, connection */
      .chip-mini {
        padding: 0.4em 0.8em;
        font-size: 0.8em;
        color: var(--muted);
        letter-spacing: 0.12em;
        font-weight: 700;
        flex: none;
      }
      .chip-mini .dot {
        display: inline-block;
        width: 0.55em;
        height: 0.55em;
        border-radius: 50%;
        background: #6ee7a8;
        margin-right: 0.5em;
        vertical-align: 0.05em;
      }
      .chip-mini.bad {
        color: #ffbdbd;
      }
      .chip-mini.bad .dot {
        background: #ff7676;
      }
      .toast {
        flex: 1;
        margin: 0 auto;
        max-width: 62%;
        padding: 0.65em 1.15em;
        text-align: center;
        color: var(--text);
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 0.25s, transform 0.25s;
        align-self: center;
      }
      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }
      .toast .lead {
        font-weight: 800;
      }
      .toast .cost {
        color: #c9e77f;
        font-weight: 700;
      }
      .toast.err {
        color: #ffc9c9;
        border-color: rgba(255, 120, 120, 0.35);
      }
      .qr-overlay {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: rgba(8, 11, 16, 0.86);
        backdrop-filter: blur(4px);
        text-align: center;
      }
      .qr-overlay.hidden {
        display: none;
      }
      .qr-overlay .label {
        color: var(--muted);
        font-size: 14px;
      }
      .qr-overlay .code {
        font-size: 40px;
        font-weight: 800;
        letter-spacing: 0.24em;
      }
      .qr-overlay canvas {
        border-radius: 12px;
        background: #fff;
        padding: 8px;
      }
      .qr-overlay .url {
        color: var(--muted);
        font-size: 12px;
        word-break: break-all;
        max-width: 80%;
      }
      .qr-overlay .dismiss {
        margin-top: 8px;
        font: inherit;
        font-size: 13px;
        padding: 8px 18px;
        border-radius: 10px;
        border: 1px solid #2a3546;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }

      /* ── controller ──────────────────────────────────────────── */
      .controller {
        position: fixed;
        inset: 0;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
      }
      .controller .status {
        position: absolute;
        top: env(safe-area-inset-top, 8px);
        left: 0;
        right: 0;
        text-align: center;
        font-size: 12px;
        color: var(--muted);
        padding: 8px;
        pointer-events: none;
        z-index: 3;
      }
      .controller .status .slot-name {
        font-weight: 800;
      }
      .controller.slot-1 {
        background: radial-gradient(120% 100% at 50% 100%, #371527 0%, var(--bg) 60%);
      }
      .controller.slot-2 {
        background: radial-gradient(120% 100% at 50% 100%, #3a2712 0%, var(--bg) 60%);
      }
      .btn-zone {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 45%;
        z-index: 2;
      }
      .stick-zone {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 55%;
        z-index: 1;
      }
      .action-btn {
        position: absolute;
        width: 88px;
        height: 88px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        font: inherit;
        font-size: 26px;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
      }
      .action-btn.pressed {
        background: rgba(255, 255, 255, 0.28);
        border-color: rgba(255, 255, 255, 0.5);
      }
      #btn-a {
        left: 20%;
        bottom: 22%;
      }
      #btn-b {
        left: 44%;
        bottom: 42%;
      }
      .stick-base {
        position: absolute;
        width: 132px;
        height: 132px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.04);
        transform: translate(-50%, -50%);
        pointer-events: none;
        opacity: 0;
      }
      .stick-nub {
        position: absolute;
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.32);
        transform: translate(-50%, -50%);
        pointer-events: none;
        opacity: 0;
      }
      .controller .zone-hint {
        position: absolute;
        bottom: 12%;
        width: 100%;
        text-align: center;
        color: rgba(255, 255, 255, 0.22);
        font-size: 13px;
        pointer-events: none;
      }
      .top-btns {
        position: absolute;
        top: calc(env(safe-area-inset-top, 8px) + 34px);
        left: 12px;
        right: 12px;
        z-index: 4;
        display: flex;
        gap: 8px;
      }
      .blueprint-btn {
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid #2a3546;
        background: rgba(21, 27, 36, 0.9);
        color: var(--text);
      }
      .blueprint-btn .badge {
        display: inline-block;
        min-width: 18px;
        margin-left: 6px;
        padding: 1px 5px;
        border-radius: 99px;
        background: var(--accent);
        color: #0b1220;
        font-size: 11px;
      }

      /* ── design library ──────────────────────────────────────── */
      .designs-overlay {
        position: fixed;
        inset: 0;
        z-index: 11;
        display: flex;
        flex-direction: column;
        background: #0c1016;
        padding: calc(env(safe-area-inset-top, 8px) + 10px) 12px 12px;
        gap: 10px;
      }
      .designs-overlay.hidden {
        display: none;
      }
      .designs-head {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: none;
      }
      .designs-head h2 {
        font-size: 15px;
        margin: 0;
        flex: 1;
      }
      .designs-head .stock {
        display: flex;
        gap: 10px;
        font-size: 13px;
        font-weight: 800;
        color: var(--muted);
      }
      .designs-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .design-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 12px;
        border-radius: 14px;
        background: var(--panel);
        border: 1px solid #232c3a;
      }
      .design-row .info {
        flex: 1;
        min-width: 0;
      }
      .design-row .dname {
        font-weight: 800;
        font-size: 14px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .design-row .dmeta {
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .design-row .dcost {
        font-size: 12px;
        font-weight: 700;
        margin-top: 3px;
      }
      .design-row .dcost .lack {
        color: #ff8f8f;
      }
      .design-row button {
        font: inherit;
        font-weight: 800;
        font-size: 13px;
        padding: 11px 16px;
        border-radius: 12px;
        border: 0;
        background: var(--accent);
        color: #0b1220;
        flex: none;
      }
      .design-row button:disabled {
        background: #263043;
        color: #6b788c;
      }
      .designs-empty {
        color: var(--muted);
        text-align: center;
        padding: 40px 20px;
        font-size: 13px;
        line-height: 1.5;
      }
      .designs-close {
        font: inherit;
        font-weight: 700;
        padding: 13px;
        border-radius: 12px;
        border: 1px solid #2a3546;
        background: var(--panel);
        color: var(--text);
        flex: none;
      }

      /* ── sketch overlay (the Fabricator blueprint pad) ────────── */
      .sketch-overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: calc(env(safe-area-inset-top, 8px) + 10px) 14px 14px;
        background: #0c1016;
        touch-action: none;
      }
      .sketch-overlay.hidden {
        display: none;
      }
      .sketch-overlay input {
        font: inherit;
        font-weight: 600;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #2a3546;
        background: var(--panel);
        color: var(--text);
        outline: none;
      }
      .sketch-card {
        flex: 1;
        min-height: 0;
        background: #f4f1e8;
        border-radius: 14px;
        overflow: hidden;
        position: relative;
      }
      .sketch-card canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      .sketch-actions {
        display: flex;
        gap: 8px;
      }
      .sketch-actions button {
        font: inherit;
        font-weight: 700;
        padding: 12px 0;
        border-radius: 12px;
        border: 1px solid #2a3546;
        background: var(--panel);
        color: var(--text);
        flex: 1;
      }
      .sketch-actions button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #0b1220;
        flex: 2;
      }
      .fabricating-note {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(env(safe-area-inset-bottom, 8px) + 8px);
        text-align: center;
        color: #8fc1ff;
        font-size: 13px;
        font-weight: 700;
        pointer-events: none;
        z-index: 5;
      }
      .fabricating-note.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0c1016" />
    <title>Fabricator</title>
    <style>
      :root {
        --bg: #0c1016;
        --panel: #151b24;
        --panel-2: #1c2430;
        --line: #232d3c;
        --text: #e8edf4;
        --muted: #8b98a9;
        --p1: #35d0ba;
        --p2: #ff9f43;
        --accent: #6c9ef8;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
        overscroll-behavior: none;
      }
      #app {
        height: 100%;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      .spacer {
        flex: 1;
      }
      .hint {
        color: var(--muted);
      }

      /* ── landing ─────────────────────────────────────────────── */
      .landing {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 28px 20px;
        text-align: center;
      }
      .landing h1 {
        font-size: 28px;
        letter-spacing: 0.14em;
        margin: 0;
      }
      .landing .sub {
        color: var(--muted);
        margin: 0 0 10px;
        font-size: 14px;
      }
      .landing .foot-note {
        color: var(--muted);
        font-size: 12px;
        max-width: 420px;
        line-height: 1.6;
        margin: 6px 0 0;
      }
      .cards {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        justify-content: center;
        width: 100%;
        max-width: 700px;
      }
      .card {
        flex: 1 1 300px;
        max-width: 340px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        text-align: left;
      }
      .card h2 {
        margin: 0;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .card p {
        margin: 0;
        font-size: 13px;
        line-height: 1.55;
        color: var(--muted);
        flex: 1;
      }
      .card b {
        color: var(--text);
      }
      .landing button,
      .join-form button {
        font-weight: 700;
        padding: 14px 20px;
        border-radius: 14px;
        border: 0;
        background: var(--accent);
        color: #0b1220;
      }
      .landing button:disabled {
        background: var(--panel-2);
        color: #56637a;
        cursor: not-allowed;
      }
      .join-form {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .join-row {
        display: flex;
        gap: 10px;
      }
      .join-form input {
        font: inherit;
        font-weight: 600;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--text);
        outline: none;
        min-width: 0;
      }
      .join-form input:focus {
        border-color: var(--accent);
      }
      .join-form #join-code {
        font-weight: 800;
        letter-spacing: 0.24em;
        width: 120px;
        text-align: center;
        text-transform: uppercase;
      }
      .join-form button {
        flex: 1;
      }

      /* ── screen lobby ────────────────────────────────────────── */
      .lobby {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .lobby-head,
      .lobby-foot {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 20px;
        font-size: 13px;
      }
      .lobby-head {
        border-bottom: 1px solid var(--line);
      }
      .lobby-foot {
        border-top: 1px solid var(--line);
      }
      .lobby-head .brand {
        font-weight: 800;
        letter-spacing: 0.16em;
      }
      .lobby-body {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-content: start;
        gap: 16px;
        padding: 16px 20px;
        overflow: auto;
      }
      .lobby-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-width: 0;
      }
      .panel-title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .panel-title .step {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--panel-2);
        color: var(--text);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0;
      }
      .join-block {
        display: flex;
        gap: 16px;
        align-items: center;
      }
      .join-block canvas {
        background: #fff;
        padding: 7px;
        border-radius: 12px;
        flex: none;
      }
      .join-copy {
        min-width: 0;
      }
      .join-copy .label {
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .join-copy .big-code {
        font-size: 46px;
        line-height: 1.1;
        font-weight: 800;
        letter-spacing: 0.18em;
      }
      .join-copy .url {
        font-size: 12px;
        color: var(--accent);
        word-break: break-all;
        margin: 2px 0 8px;
      }
      .slots {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .slot-card {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border-radius: 14px;
        background: var(--panel-2);
        border: 1px solid transparent;
      }
      .slot-card .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #3a465c;
        flex: none;
      }
      .slot-card.p1.ready,
      .slot-card.p1.joined {
        border-color: rgba(53, 208, 186, 0.45);
      }
      .slot-card.p2.ready,
      .slot-card.p2.joined {
        border-color: rgba(255, 159, 67, 0.45);
      }
      .slot-card.p1.ready .dot,
      .slot-card.p1.joined .dot {
        background: var(--p1);
      }
      .slot-card.p2.ready .dot,
      .slot-card.p2.joined .dot {
        background: var(--p2);
      }
      .slot-card.ready .dot {
        box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.08);
      }
      .slot-card.empty .slot-name,
      .slot-card.offline .slot-name {
        color: var(--muted);
      }
      .slot-name {
        font-weight: 700;
        font-size: 16px;
      }
      .slot-state {
        font-size: 12px;
        color: var(--muted);
      }
      .spectators {
        font-size: 12px;
        color: var(--muted);
      }

      /* world settings + preview */
      .preview-row {
        display: flex;
        gap: 14px;
        align-items: stretch;
      }
      .preview-frame {
        flex: 0 0 46%;
        aspect-ratio: 1;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--line);
        background: #0a0d12;
      }
      .preview-frame canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      .preview-meta {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
      }
      .meta-line b {
        color: var(--text);
        font-size: 14px;
      }
      .meta-note {
        margin-top: auto;
      }
      .mix-row {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .mix-row .swatch {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        flex: none;
      }
      .swatch.grass {
        background: #3f7d3a;
      }
      .swatch.sand {
        background: #d8c07a;
      }
      .swatch.swamp {
        background: #4a5236;
      }
      .mix-label {
        width: 44px;
      }
      .mix-bar {
        flex: 1;
        height: 5px;
        border-radius: 3px;
        background: var(--panel-2);
        overflow: hidden;
      }
      .mix-bar span {
        display: block;
        height: 100%;
        background: #46536a;
      }
      .mix-pct {
        width: 32px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .settings {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .setting {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .setting > label {
        width: 96px;
        flex: none;
        font-size: 12px;
        color: var(--muted);
      }
      .seed-row {
        display: flex;
        gap: 8px;
        flex: 1;
        min-width: 0;
      }
      .seed-row input {
        font: inherit;
        font-size: 14px;
        flex: 1;
        min-width: 0;
        padding: 8px 12px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--text);
        outline: none;
      }
      .seed-row input:focus {
        border-color: var(--accent);
      }
      .seed-row button {
        padding: 8px 12px;
        font-size: 12px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--text);
      }
      .segmented {
        display: flex;
        flex: 1;
        gap: 4px;
        padding: 3px;
        border-radius: 12px;
        background: var(--panel-2);
      }
      .segmented button {
        flex: 1;
        padding: 7px 6px;
        font-size: 12px;
        font-weight: 700;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--muted);
      }
      .segmented button.on {
        background: #2c3a50;
        color: var(--text);
      }
      .lobby-foot button.primary {
        font-weight: 800;
        letter-spacing: 0.08em;
        padding: 14px 30px;
        border-radius: 14px;
        border: 0;
        background: var(--accent);
        color: #0b1220;
      }
      .lobby-foot button.pulse {
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(108, 158, 248, 0.5);
        }
        50% {
          box-shadow: 0 0 0 10px rgba(108, 158, 248, 0);
        }
      }
      @media (max-width: 900px) {
        .lobby-body {
          grid-template-columns: 1fr;
        }
        .join-copy .big-code {
          font-size: 36px;
        }
      }

      /* ── screen (playing) ────────────────────────────────────── */
      .screen {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .screen-stage {
        position: relative;
        flex: 1;
        min-height: 0;
        background: #000;
      }
      .screen-stage canvas {
        display: block;
      }
      .split-divider {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 3px;
        transform: translateX(-50%);
        background: #0c1016;
        pointer-events: none;
        z-index: 5;
      }
      .screen-hud {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 8px 14px;
        background: var(--panel);
        font-size: 13px;
      }
      .screen-hud .code {
        font-weight: 800;
        letter-spacing: 0.18em;
      }
      .screen-hud .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px;
        border-radius: 99px;
        background: var(--panel-2);
        color: var(--muted);
      }
      .screen-hud .chip .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #45526a;
      }
      .screen-hud .chip.on {
        color: var(--text);
      }
      .screen-hud .chip.p1.on .dot {
        background: var(--p1);
      }
      .screen-hud .chip.p2.on .dot {
        background: var(--p2);
      }
      .screen-hud .hud-btn {
        padding: 5px 12px;
        font-size: 12px;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--muted);
      }
      .screen-hud .hud-btn:hover {
        color: var(--text);
      }

      /* ── controller lobby ────────────────────────────────────── */
      .pad-lobby {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: calc(env(safe-area-inset-top, 10px) + 10px) 16px
          calc(env(safe-area-inset-bottom, 10px) + 14px);
        background: var(--bg);
      }
      .pad-lobby.slot-1 {
        background: radial-gradient(120% 90% at 50% 0%, #10312c 0%, var(--bg) 55%);
      }
      .pad-lobby.slot-2 {
        background: radial-gradient(120% 90% at 50% 0%, #3a2712 0%, var(--bg) 55%);
      }
      .pad-lobby-head {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
      }
      .pad-lobby-head .room {
        font-weight: 800;
        letter-spacing: 0.16em;
        color: var(--text);
      }
      .you-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .you-slot {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.18em;
      }
      .you-slot.p1 {
        color: var(--p1);
      }
      .you-slot.p2 {
        color: var(--p2);
      }
      .you-slot.spectator {
        color: var(--muted);
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .field span {
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .field input {
        font: inherit;
        font-size: 22px;
        font-weight: 700;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--text);
        outline: none;
      }
      .field input:focus {
        border-color: var(--accent);
      }
      .lobby-roster {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .roster-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-radius: 14px;
        background: var(--panel);
        border: 1px solid var(--line);
        font-size: 14px;
      }
      .roster-row .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: none;
      }
      .roster-row.p1 .dot {
        background: var(--p1);
      }
      .roster-row.p2 .dot {
        background: var(--p2);
      }
      .roster-row.offline .dot {
        background: #3a465c;
      }
      .roster-row .rname {
        font-weight: 700;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .roster-row .rstate {
        font-size: 12px;
        color: var(--muted);
      }
      .roster-empty {
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px dashed var(--line);
        color: var(--muted);
        font-size: 13px;
      }
      .lobby-actions {
        margin-top: auto;
        display: flex;
        gap: 10px;
      }
      .lobby-actions .ghost {
        padding: 16px 18px;
        border-radius: 16px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }
      .ready-btn {
        flex: 1;
        padding: 18px;
        border-radius: 16px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0.08em;
      }
      .ready-btn.on {
        background: var(--accent);
        border-color: var(--accent);
        color: #0b1220;
      }
      .ready-btn:disabled {
        opacity: 0.45;
      }
      .pad-lobby .lobby-foot {
        border: 0;
        padding: 0;
        justify-content: center;
        text-align: center;
        font-size: 12px;
        color: var(--muted);
        min-height: 16px;
      }

      /* ── controller (playing) ────────────────────────────────── */
      .controller {
        position: fixed;
        inset: 0;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
      }
      .controller .status {
        position: absolute;
        top: env(safe-area-inset-top, 8px);
        left: 0;
        right: 0;
        text-align: center;
        font-size: 12px;
        color: var(--muted);
        padding: 8px;
        pointer-events: none;
        z-index: 3;
      }
      .controller .status .slot-name {
        font-weight: 800;
      }
      .controller.slot-1 {
        background: radial-gradient(120% 100% at 50% 100%, #10312c 0%, var(--bg) 60%);
      }
      .controller.slot-2 {
        background: radial-gradient(120% 100% at 50% 100%, #3a2712 0%, var(--bg) 60%);
      }
      .btn-zone {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 45%;
        z-index: 2;
      }
      .stick-zone {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 55%;
        z-index: 1;
      }
      .action-btn {
        position: absolute;
        width: 88px;
        height: 88px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        font: inherit;
        font-size: 26px;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
      }
      .action-btn.pressed {
        background: rgba(255, 255, 255, 0.28);
        border-color: rgba(255, 255, 255, 0.5);
      }
      #btn-a {
        left: 20%;
        bottom: 22%;
      }
      #btn-b {
        left: 44%;
        bottom: 42%;
      }
      .stick-base {
        position: absolute;
        width: 132px;
        height: 132px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.14);
        background: rgba(255, 255, 255, 0.04);
        transform: translate(-50%, -50%);
        pointer-events: none;
        opacity: 0;
      }
      .stick-nub {
        position: absolute;
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.32);
        transform: translate(-50%, -50%);
        pointer-events: none;
        opacity: 0;
      }
      .controller .zone-hint {
        position: absolute;
        bottom: 12%;
        width: 100%;
        text-align: center;
        color: rgba(255, 255, 255, 0.22);
        font-size: 13px;
        pointer-events: none;
      }
      .blueprint-btn {
        position: absolute;
        top: calc(env(safe-area-inset-top, 8px) + 34px);
        left: 12px;
        z-index: 4;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(21, 27, 36, 0.9);
        color: var(--text);
      }

      /* ── sketch overlay (the Fabricator blueprint pad) ────────── */
      .sketch-overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: calc(env(safe-area-inset-top, 8px) + 10px) 14px 14px;
        background: #0c1016;
        touch-action: none;
      }
      .sketch-overlay.hidden {
        display: none;
      }
      .sketch-overlay input {
        font: inherit;
        font-weight: 600;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
        outline: none;
      }
      .sketch-card {
        flex: 1;
        min-height: 0;
        background: #f4f1e8;
        border-radius: 14px;
        overflow: hidden;
        position: relative;
      }
      .sketch-card canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      .sketch-actions {
        display: flex;
        gap: 8px;
      }
      .sketch-actions button {
        font: inherit;
        font-weight: 700;
        padding: 12px 0;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
        flex: 1;
      }
      .sketch-actions button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #0b1220;
        flex: 2;
      }
      .fabricating-note {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(env(safe-area-inset-bottom, 8px) + 8px);
        text-align: center;
        color: #8fc1ff;
